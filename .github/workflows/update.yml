name: Update dashboard

on:
  schedule:
    # Thursday and Friday at 13:07 UTC = 7:07 AM Central in fall (8:07 AM in summer).
    # GitHub sometimes starts scheduled runs a few minutes late.
    - cron: '7 13 * * 4,5'
  workflow_dispatch:        # adds the "Run workflow" button on the Actions tab
  push:
    branches: [main]        # republish the page when you edit notes.txt or the page itself

permissions:
  contents: write           # lets the run save the new data.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'

      - name: Pull this week's games
        if: github.event_name != 'push'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional: turns on AI news notes
        run: python scripts/build_data.py

      - name: Save data.json to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/weeks
          git diff --staged --quiet || git commit -m "Update dashboard data"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
